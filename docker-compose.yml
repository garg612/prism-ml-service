services:
  prism-ml:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: prism-ml-service

    ports:
      - "8000:10000"
    environment:
      PORT: "10000"

    restart: unless-stopped

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health').read()"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s